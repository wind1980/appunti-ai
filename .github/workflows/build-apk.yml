name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # L'SDK Android è già installato sui server di GitHub: si aggiungono solo i pezzi mancanti.
      - name: Installa SDK 35, NDK e CMake
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "Uso $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepara APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppuntiAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppuntiAI-apk
          path: AppuntiAI.apk

      # Ogni compilazione riuscita diventa una "release": dal telefono si scarica
      # sempre l'ultima da .../releases/latest/download/AppuntiAI.apk
      # La release (il link che si scarica sul telefono) esce solo da main:
      # un avvio manuale su un altro ramo serve solo a verificare che compili.
      - name: Pubblica release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Appunti AI – build ${{ github.run_number }}
          body: Compilata dal commit ${{ github.sha }}
          files: AppuntiAI.apk
          make_latest: true
